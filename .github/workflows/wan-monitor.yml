name: WAN-Volumen Uebersicht

on:
  # GitHubs eigener Cron feuert bei diesem Repo aus unbekanntem Grund nicht
  # zuverlaessig - bleibt als harmloser Fallback stehen. Primaer getriggert
  # wird jetzt extern (cron-job.org) ueber den workflow_dispatch-Event alle
  # 1 Minute via GitHub-API.
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# Pages baut aus dem Branch gh-pages, nicht mehr ueber die Deploy-Action -
# pages/id-token werden dafuer nicht gebraucht, schreibender Zugriff aufs
# Repository genuegt.
permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    # Nur den poll-Job serialisieren (nicht den ganzen Workflow inkl. Deploy -
    # das stand frueher hier auf Workflow-Ebene und brach dadurch auch einen
    # bereits laufenden 'veroeffentlichen'-Deploy ab, sobald der naechste
    # Poll-Trigger (alle ~1 Minute) eintraf. Bei einer Laufzeit von poll+
    # veroeffentlichen zusammen ueber ~1 Minute wurde dadurch praktisch JEDER
    # Deploy vom naechsten abgebrochen, bevor er fertig war - die Live-Seite
    # blieb dauerhaft auf einem alten Stand haengen, obwohl staendig neue
    # Commits gepusht wurden. Lieber den aktuellsten Poll-Trigger gewinnen
    # lassen und einen veralteten, noch laufenden Poll abbrechen (das war der
    # urspruengliche Zweck), aber den Deploy einmal gestartet durchlaufen
    # lassen - GitHub Pages serialisiert Deployments zum selben Environment
    # ohnehin selbst.
    concurrency:
      group: wan-monitor-poll
      cancel-in-progress: true
    steps:
      - name: Zeitmessung start
        run: echo "T_JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          # Volle Git-Historie (waechst mit jedem Lauf) macht den Checkout mit
          # der Zeit langsamer, bis der 2-Minuten-Takt gesprengt wird. Flacher
          # Klon reicht, wir brauchen keine Historie, nur den aktuellen Stand.
          fetch-depth: 1

      - name: Zeitmessung nach Checkout
        run: echo "T_AFTER_CHECKOUT=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zeitmessung nach Setup-Python
        run: echo "T_AFTER_SETUP=$(date +%s)" >> "$GITHUB_ENV"

      - name: Messpunkte holen und Bericht bauen
        env:
          UI_API_KEY: ${{ secrets.UI_API_KEY }}
          TZ: Europe/Berlin
        run: |
          python3 udm_wan_monitor.py --once \
            --start "${{ vars.MESS_START || '2026-08-11T08:00' }}" \
            --interval "${{ vars.POLL_INTERVAL || '60' }}"
          echo "T_AFTER_PYTHON=$(date +%s)" >> "$GITHUB_ENV"

      - name: Ergebnis sichern
        run: |
          git config user.name "wan-monitor"
          git config user.email "wan-monitor@users.noreply.github.com"

          T_ADD_START=$(date +%s)
          # wan_report.html/public/index.html werden bewusst NICHT (mehr)
          # committet - sie werden bei jedem Lauf komplett neu erzeugt und nur
          # fuer den Pages-Deploy im naechsten Job gebraucht (aus dem
          # Dateisystem, ueber upload-pages-artifact unten). Vorher liessen sie
          # die Git-Historie auf ueber 3.7GB anwachsen, da sich ihr Inhalt
          # (eingebettete Chart-Daten/Zeitstempel) bei praktisch jedem Poll
          # fast vollstaendig aendert und kaum delta-komprimierbar ist.
          git add wan_traffic.csv monitor_state.json
          # Keine eigenen Detailseiten pro Konsole mehr (Nutzerwunsch: reine
          # Uebersichtskacheln reichen) - alte, jetzt verwaiste *--UDM-1.html
          # aus einem frueheren Lauf mit entfernen (Index UND Arbeitsverzeichnis),
          # statt sie fuer immer als toten, eingefrorenen Stand stehen zu lassen.
          git rm --ignore-unmatch -q '*--UDM-1.html' 'public/*--UDM-1.html' 'public/index.html'
          T_ADD_END=$(date +%s)
          git diff --staged --quiet || git commit -m "Messpunkte $(date -u +%FT%RZ)"
          T_COMMIT_END=$(date +%s)

          # Bei ueberlappenden Laeufen kann ein reiner "git push" am Konflikt
          # scheitern (non-fast-forward). Statt den ganzen Job fehlschlagen zu
          # lassen: mit frischem Stand rebasen und erneut versuchen.
          pushed=false
          push_attempts=0
          for attempt in 1 2 3 4 5; do
            push_attempts=$attempt
            if git push; then
              pushed=true
              break
            fi
            echo "Push fehlgeschlagen (Versuch $attempt), hole aktuellen Stand und versuche erneut..."
            if ! git fetch origin master; then
              echo "Fetch fehlgeschlagen, verwerfe diesen Poll-Versuch."
              break
            fi
            if ! git rebase origin/master; then
              echo "Rebase-Konflikt, verwerfe diesen Poll-Versuch."
              # Ungesichert wuerde ein fehlgeschlagener 'git rebase --abort'
              # (z.B. wenn wegen eines Race gar kein Rebase mehr aktiv ist)
              # selbst mit exit 128 den ganzen Schritt scheitern lassen - das
              # sollte hier aber nur eine Warnung sein, kein harter Fehlschlag.
              git rebase --abort || true
              break
            fi
            sleep 2
          done
          T_PUSH_END=$(date +%s)
          if [ "$pushed" != "true" ]; then
            echo "::warning::Konnte Messpunkt nicht pushen, dieser Poll geht verloren (naechster Lauf holt es i.d.R. nach)."
          fi

          # Laufzeit-Diagnose je Phase als Annotation - auch OHNE GitHub-Login
          # auf der Actions-Lauf-Seite sichtbar (im Gegensatz zu den vollen
          # Step-Logs), um den tatsaechlichen Flaschenhals zu finden statt
          # weiter zu raten.
          echo "::notice title=Laufzeit-Diagnose::checkout=$((T_AFTER_CHECKOUT - T_JOB_START))s setup_python=$((T_AFTER_SETUP - T_AFTER_CHECKOUT))s api_poll=$((T_AFTER_PYTHON - T_AFTER_SETUP))s git_add=$((T_ADD_END - T_ADD_START))s git_commit=$((T_COMMIT_END - T_ADD_END))s git_push=$((T_PUSH_END - T_COMMIT_END))s push_attempts=${push_attempts} pushed=${pushed} total=$(($(date +%s) - T_JOB_START))s"

      - name: Veroeffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          T_PAGES_START=$(date +%s)
          # Immer genau EIN Commit auf gh-pages (frisches Repo, force-push):
          # die HTML aendert sich bei jedem Poll fast vollstaendig und ist
          # kaum delta-komprimierbar - eine wachsende Historie hatte das
          # Repository frueher auf 3,7 GB getrieben.
          rm -rf "$RUNNER_TEMP/pages"
          mkdir -p "$RUNNER_TEMP/pages"
          cp wan_report.html "$RUNNER_TEMP/pages/index.html"
          # Ohne .nojekyll wuerde Pages die Datei durch Jekyll schicken.
          : > "$RUNNER_TEMP/pages/.nojekyll"
          cd "$RUNNER_TEMP/pages"
          git init -q
          git config user.name "wan-monitor"
          git config user.email "wan-monitor@users.noreply.github.com"
          git add -A
          git commit -q -m "Veroeffentlichter Stand $(date -u +%FT%RZ)"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:gh-pages
          echo "::notice title=Veroeffentlicht::pages_push=$(($(date +%s) - T_PAGES_START))s"
