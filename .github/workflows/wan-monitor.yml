name: WAN-Volumen Uebersicht

on:
  # GitHubs eigener Cron feuert bei diesem Repo aus unbekanntem Grund nicht
  # zuverlaessig - bleibt als harmloser Fallback stehen. Primaer getriggert
  # wird jetzt extern (cron-job.org) ueber den workflow_dispatch-Event alle
  # 1 Minute via GitHub-API.
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  # Zum Lesen der github-pages-Deployments und ihrer Zustaende, siehe den
  # Schritt 'Haengendes Pages-Deployment abbrechen' weiter unten.
  deployments: write

jobs:
  poll:
    runs-on: ubuntu-latest
    # Nur den poll-Job serialisieren (nicht den ganzen Workflow inkl. Deploy -
    # das stand frueher hier auf Workflow-Ebene und brach dadurch auch einen
    # bereits laufenden 'veroeffentlichen'-Deploy ab, sobald der naechste
    # Poll-Trigger (alle ~1 Minute) eintraf. Bei einer Laufzeit von poll+
    # veroeffentlichen zusammen ueber ~1 Minute wurde dadurch praktisch JEDER
    # Deploy vom naechsten abgebrochen, bevor er fertig war - die Live-Seite
    # blieb dauerhaft auf einem alten Stand haengen, obwohl staendig neue
    # Commits gepusht wurden. Lieber den aktuellsten Poll-Trigger gewinnen
    # lassen und einen veralteten, noch laufenden Poll abbrechen (das war der
    # urspruengliche Zweck), aber den Deploy einmal gestartet durchlaufen
    # lassen - GitHub Pages serialisiert Deployments zum selben Environment
    # ohnehin selbst.
    concurrency:
      group: wan-monitor-poll
      cancel-in-progress: true
    steps:
      - name: Zeitmessung start
        run: echo "T_JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          # Volle Git-Historie (waechst mit jedem Lauf) macht den Checkout mit
          # der Zeit langsamer, bis der 2-Minuten-Takt gesprengt wird. Flacher
          # Klon reicht, wir brauchen keine Historie, nur den aktuellen Stand.
          fetch-depth: 1

      - name: Zeitmessung nach Checkout
        run: echo "T_AFTER_CHECKOUT=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zeitmessung nach Setup-Python
        run: echo "T_AFTER_SETUP=$(date +%s)" >> "$GITHUB_ENV"

      - name: Messpunkte holen und Bericht bauen
        env:
          UI_API_KEY: ${{ secrets.UI_API_KEY }}
          TZ: Europe/Berlin
        run: |
          python3 udm_wan_monitor.py --once \
            --start "${{ vars.MESS_START || '2026-08-11T08:00' }}" \
            --interval "${{ vars.POLL_INTERVAL || '60' }}"
          echo "T_AFTER_PYTHON=$(date +%s)" >> "$GITHUB_ENV"

      - name: Ergebnis sichern
        run: |
          git config user.name "wan-monitor"
          git config user.email "wan-monitor@users.noreply.github.com"
          mkdir -p public
          cp wan_report.html public/index.html
          # Winzige Standdatei: die Seite fragt nur sie ab und laedt sich erst
          # neu, wenn dort ein neuerer Zeitpunkt steht (siehe STAND_PATH).
          cp wan_stand.txt public/wan_stand.txt

          T_ADD_START=$(date +%s)
          # wan_report.html/public/index.html werden bewusst NICHT (mehr)
          # committet - sie werden bei jedem Lauf komplett neu erzeugt und nur
          # fuer den Pages-Deploy im naechsten Job gebraucht (aus dem
          # Dateisystem, ueber upload-pages-artifact unten). Vorher liessen sie
          # die Git-Historie auf ueber 3.7GB anwachsen, da sich ihr Inhalt
          # (eingebettete Chart-Daten/Zeitstempel) bei praktisch jedem Poll
          # fast vollstaendig aendert und kaum delta-komprimierbar ist.
          git add wan_traffic.csv monitor_state.json
          # Keine eigenen Detailseiten pro Konsole mehr (Nutzerwunsch: reine
          # Uebersichtskacheln reichen) - alte, jetzt verwaiste *--UDM-1.html
          # aus einem frueheren Lauf mit entfernen (Index UND Arbeitsverzeichnis),
          # statt sie fuer immer als toten, eingefrorenen Stand stehen zu lassen.
          git rm --ignore-unmatch -q '*--UDM-1.html' 'public/*--UDM-1.html'
          T_ADD_END=$(date +%s)
          git diff --staged --quiet || git commit -m "Messpunkte $(date -u +%FT%RZ)"
          T_COMMIT_END=$(date +%s)

          # Bei ueberlappenden Laeufen kann ein reiner "git push" am Konflikt
          # scheitern (non-fast-forward). Statt den ganzen Job fehlschlagen zu
          # lassen: mit frischem Stand rebasen und erneut versuchen.
          pushed=false
          push_attempts=0
          for attempt in 1 2 3 4 5; do
            push_attempts=$attempt
            if git push; then
              pushed=true
              break
            fi
            echo "Push fehlgeschlagen (Versuch $attempt), hole aktuellen Stand und versuche erneut..."
            if ! git fetch origin master; then
              echo "Fetch fehlgeschlagen, verwerfe diesen Poll-Versuch."
              break
            fi
            if ! git rebase origin/master; then
              echo "Rebase-Konflikt, verwerfe diesen Poll-Versuch."
              # Ungesichert wuerde ein fehlgeschlagener 'git rebase --abort'
              # (z.B. wenn wegen eines Race gar kein Rebase mehr aktiv ist)
              # selbst mit exit 128 den ganzen Schritt scheitern lassen - das
              # sollte hier aber nur eine Warnung sein, kein harter Fehlschlag.
              git rebase --abort || true
              break
            fi
            sleep 2
          done
          T_PUSH_END=$(date +%s)
          if [ "$pushed" != "true" ]; then
            echo "::warning::Konnte Messpunkt nicht pushen, dieser Poll geht verloren (naechster Lauf holt es i.d.R. nach)."
          fi

          # Monatliches Kuerzen der Git-Historie.
          #
          # Warum ueberhaupt: wan_traffic.csv IST der Datenspeicher des
          # Monitors (sie kann nicht ignoriert werden, sonst gehen die
          # Messpunkte verloren) und wird von merge_rows() bei JEDEM Poll
          # komplett neu geschrieben. Jeder Minuten-Commit legt damit einen
          # neuen Blob der ganzen Datei ab - gemessen rund 13 MB Packfile pro
          # Tag, also ~400 MB im Monat. Nach 36 Tagen Laufzeit war das Repo
          # dadurch auf 1,9 GB angewachsen.
          #
          # Die Historie wird hier nirgends gebraucht: der Checkout oben klont
          # ohnehin mit fetch-depth: 1, und fuer das Dashboard zaehlt nur der
          # jeweils aktuelle Stand. Einmal im Monat wird sie deshalb auf einen
          # einzelnen Wurzel-Commit mit dem aktuellen Baum zusammengefasst -
          # bitgenau derselbe Inhalt, nur ohne Vorgeschichte.
          #
          # Gesteuert ueber die winzige Markerdatei .git-historie-stand
          # (Inhalt: YYYY-MM des letzten Kuerzens). Ein Commit-Zaehler oder
          # ein Vergleich mit dem Datum des ersten Commits waere hier nicht
          # moeglich, weil der flache Klon die Historie gar nicht kennt. So
          # laeuft es genau einmal pro Monat, beim ersten Poll des Monats -
          # unabhaengig von GitHubs eigenem Cron, der bei diesem Repo nicht
          # verlaesslich feuert (siehe 'on:' oben).
          MONAT_JETZT=$(date -u +%Y-%m)
          MONAT_MARKER=$(cat .git-historie-stand 2>/dev/null || echo "")
          # Nur kuerzen, wenn der Messpunkt oben wirklich durchging: sonst
          # wuerde der Force-Push einen nicht gepushten Stand zementieren und
          # im schlimmsten Fall einen fremden Messpunkt ueberschreiben.
          if [ "$pushed" = "true" ] && [ "$MONAT_MARKER" != "$MONAT_JETZT" ]; then
            # Stand, den wir eben selbst gepusht haben - dagegen laeuft das
            # Lease unten. Hat in der Zwischenzeit ein anderer Lauf gepusht,
            # schlaegt der Force-Push fehl, statt dessen Messpunkt zu
            # verschlucken; der Marker ist dann noch nicht remote, also
            # versucht es der naechste Poll von selbst erneut.
            SHA_GEPUSHT=$(git rev-parse HEAD)
            echo "$MONAT_JETZT" > .git-historie-stand
            git add .git-historie-stand
            git commit -q -m "Git-Historie gekuerzt (Stand $MONAT_JETZT)"
            # Ohne -p: ein Commit ohne Eltern, also eine neue Wurzel. Mehrere
            # -m ergeben Absaetze, ohne dass die YAML-Einrueckung im
            # Commit-Text landet.
            WURZEL=$(git commit-tree "HEAD^{tree}" \
              -m "Wan-Monitor: Stand $(date -u +%FT%RZ), Historie gekuerzt" \
              -m "Monatliches Zusammenfassen der Minuten-Commits (siehe wan-monitor.yml). Inhalt unveraendert, nur ohne Vorgeschichte - die braucht hier niemand, der Checkout klont mit fetch-depth: 1.")
            if git push --force-with-lease=master:"$SHA_GEPUSHT" origin "$WURZEL":master; then
              echo "::notice title=Git-Historie::Auf einen Wurzel-Commit gekuerzt ($WURZEL), Marker steht jetzt auf $MONAT_JETZT."
            else
              echo "::warning::Kuerzen der Historie fehlgeschlagen (fremder Push dazwischen?), der naechste Poll versucht es erneut."
            fi
          fi

          # Laufzeit-Diagnose je Phase als Annotation - auch OHNE GitHub-Login
          # auf der Actions-Lauf-Seite sichtbar (im Gegensatz zu den vollen
          # Step-Logs), um den tatsaechlichen Flaschenhals zu finden statt
          # weiter zu raten.
          echo "::notice title=Laufzeit-Diagnose::checkout=$((T_AFTER_CHECKOUT - T_JOB_START))s setup_python=$((T_AFTER_SETUP - T_AFTER_CHECKOUT))s api_poll=$((T_AFTER_PYTHON - T_AFTER_SETUP))s git_add=$((T_ADD_END - T_ADD_START))s git_commit=$((T_COMMIT_END - T_ADD_END))s git_push=$((T_PUSH_END - T_COMMIT_END))s push_attempts=${push_attempts} pushed=${pushed} total=$(($(date +%s) - T_JOB_START))s"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  veroeffentlichen:
    needs: poll
    runs-on: ubuntu-latest
    # Ohne jede concurrency hier konnten mehrere veroeffentlichen-Laeufe
    # gleichzeitig starten und kollidierten an der GitHub-Pages-API: "Failed
    # to create deployment (status: 400) ... due to in progress deployment".
    # Es braucht also eine Gruppe - die Frage ist nur, was mit einem bereits
    # laufenden Deploy passiert.
    #
    # cancel-in-progress: true war hier die falsche Antwort und hat den
    # Monitor am 27.10.2026 ueber eine Viertelstunde eingefroren. Gemessen an
    # 60 Laeufen: ein erfolgreicher Deploy dauert 7-11s ("Created deployment"
    # -> "Reported success!" in rund 6s), die ABGEBROCHENEN Jobs sassen aber
    # 45-100s da, ohne einen einzigen Step auszufuehren. Das ist kein
    # langsamer Pages-Dienst, das ist Wartezeit auf den Abbruch des Vorgaengers:
    # ein neuer Lauf darf die Gruppe erst betreten, wenn dessen Teardown
    # fertig ist, und das dauert ungefaehr eine Minute - also genau unseren
    # Triggerabstand. Jeder Lauf bricht damit den vorherigen ab und wartet
    # dann auf dessen Teardown, bis ihn der naechste abbricht. Ein Livelock,
    # der sich nur loest, wenn zufaellig ein Trigger ausfaellt.
    #
    # false heisst auf JOB-Ebene ausdruecklich nicht "unbegrenzte
    # Warteschlange" (das galt fuer die frueher hier stehende Variante auf
    # Workflow-Ebene): GitHub laesst je Gruppe genau einen Lauf arbeiten und
    # genau einen warten, und ein neuer Wartender ersetzt den alten. Damit
    # bleibt "der aktuellste Stand gewinnt" erhalten, ohne eine Minute
    # Teardown zu bezahlen - die Seite hinkt hoechstens einen Deploy (~10s)
    # hinter dem Poll her.
    concurrency:
      group: wan-monitor-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Am 29.10.2026 blieb ein serverseitiges Pages-Deployment 28 Minuten in
      # 'in_progress' haengen. Jeder folgende Lauf bekam daraufhin HTTP 400:
      # "due to in progress deployment. Please cancel <id> first or wait for
      # it to complete." - 28 Fehlschlaege, 28 Mails, und die Seite stand so
      # lange still, bis GitHub es von selbst aufloeste.
      #
      # Genau das tun wir jetzt selbst: haengt ein Deployment laenger als 90
      # Sekunden, wird es abgebrochen. Die Schwelle trennt es von einem ganz
      # normalen, eben erst gestarteten Deploy - der ist nach 7-11s fertig
      # (gemessen), und einen laufenden wollen wir nicht stoeren.
      #
      # Der Schritt darf den Job nie scheitern lassen; er ist Vorsorge, kein
      # Selbstzweck. Jeder API-Aufruf ist mit '|| true' abgesichert, am Ende
      # steht ein 'exit 0', und continue-on-error faengt den Rest.
      - name: Haengendes Pages-Deployment abbrechen
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          jetzt=$(date -u +%s)
          liste="$RUNNER_TEMP/deployments.txt"
          abfrage="deployments?environment=github-pages&per_page=10"
          # Durch Leerzeichen getrennt: ID, SHA und ISO-Zeitstempel enthalten
          # selbst keine, also braucht es hier keinen Trennzeichen-Zauber.
          format='.[] | "\(.id) \(.sha) \(.created_at)"'
          gh api "repos/$REPO/$abfrage" --jq "$format" > "$liste" || true

          while read -r id sha erstellt; do
            [ -n "$id" ] || continue
            # Der zuletzt gemeldete Zustand zaehlt; 'statuses' liefert den
            # neuesten zuerst. Fehlt er ganz, ist das Deployment eben erst
            # angelegt worden - also nicht unser Fall.
            pfad="repos/$REPO/deployments/$id/statuses?per_page=1"
            zustand=$(gh api "$pfad" --jq '.[0].state // "ohne"' || echo "ohne")
            case "$zustand" in
              queued|pending|waiting|in_progress) ;;
              *) continue ;;
            esac
            begonnen=$(date -u -d "$erstellt" +%s)
            alter=$(( jetzt - begonnen ))
            if [ "$alter" -lt 90 ]; then
              echo "Deployment $sha laeuft seit ${alter}s ($zustand) - normal, in Ruhe lassen."
              continue
            fi
            echo "::warning title=Pages-Deployment haengt::$sha steht seit ${alter}s auf '$zustand' und wird abgebrochen."
            # Die Pages-API nimmt hier die Build-Version, also den SHA - genau
            # die ID, die der Fehlschlag oben nennt.
            if gh api -X POST "repos/$REPO/pages/deployments/$sha/cancel"; then
              echo "Abgebrochen, der naechste Deploy hat freie Bahn."
            else
              echo "::warning::Abbruch von $sha fehlgeschlagen, der naechste Lauf versucht es erneut."
            fi
          done < "$liste"
          exit 0

      # continue-on-error: ein einzelner Fehlschlag ist KEIN Grund, den Lauf
      # rot zu faerben und eine Mail zu schicken. Die naechste Messung kommt
      # in einer Minute und veroeffentlicht denselben Stand erneut; mit dem
      # Abbruch-Schritt oben ist die Ursache bis dahin meist beseitigt. Ein
      # roter Lauf pro Minute waere nur Laerm, der genau dann aufhoert, wenn
      # man ihn abstellt - also kein Signal.
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4

      # Unsichtbar wird der Fehlschlag damit nicht: er steht als Annotation am
      # Lauf (Annotationen mailen nicht) - und die Seite selbst prueft ihren
      # Stand und weist einen veralteten aus.
      - name: Fehlgeschlagenen Deploy vermerken
        if: steps.deploy.outcome == 'failure'
        run: |
          echo "::warning title=Deploy uebersprungen::Dieser Stand wurde nicht veroeffentlicht; der naechste Lauf holt es nach."
